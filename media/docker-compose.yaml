  sonarr:
    image: linuxserver/sonarr:latest
    container_name: media-sonarr
    network_mode: bridge
    environment:
      - PUID=${DOCKER_PUID}
      - PGID=${DOCKER_PGID}
      - TZ=Asia/Jerusalem
    volumes:
      - /volume1/Media/SmartHome/Config/sonarr:/config
      - /volume1/Media/Incoming:/downloads
      - /volume1/Media/TV Shows:/data/tvshows
    ports:
      - "8989:8989"
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 4.4.4.4
      - 1.1.1.1
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  radarr:
    image: linuxserver/radarr:latest
    container_name: media-radarr
    network_mode: bridge
    environment:
      - PUID=${DOCKER_PUID}
      - PGID=${DOCKER_PGID}
      - TZ=Asia/Jerusalem
    volumes:
      - /volume1/Media/SmartHome/Config/radarr:/config
      - /volume1/Media/Incoming/:/downloads
      - /volume1/Media/Movies:/movies
    ports:
      - "7878:7878"
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 4.4.4.4
      - 1.1.1.1
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  bazarr:
    image: linuxserver/bazarr:latest
    network_mode: bridge
    container_name: media-bazarr
    environment:
      - PUID=${DOCKER_PUID}
      - PGID=${DOCKER_PGID}
      - TZ=Asia/Jerusalem
    volumes:
      - /volume1/Media/SmartHome/Config/bazarr:/config
      - /volume1/Media/Incoming:/downloads
      - /volume1/Media/TV Shows:/data/tvshows
    ports:
      - "6767:6767"
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 4.4.4.4
      - 1.1.1.1
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  jackett:
    image: linuxserver/jackett:latest
    network_mode: bridge
    container_name: media-jackett
    environment:
      - PUID=${DOCKER_PUID}
      - PGID=${DOCKER_PGID}
      - TZ=Asia/Jerusalem
    volumes:
      - /volume1/Media/SmartHome/Config/jackett:/config
    ports:
      - "9117:9117"
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 4.4.4.4
      - 1.1.1.1
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: media-prowlarr
    network_mode: bridge
    environment:
      - PUID=${DOCKER_PUID}
      - PGID=${DOCKER_PGID}
      - TZ=Asia/Jerusalem
    volumes:
      - /volume1/Media/SmartHome/Config/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 4.4.4.4
      - 1.1.1.1
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  jellyseer:
    image: fallenbagel/jellyseerr:2.7.3
    network_mode: bridge
    container_name: media-jellyseer
    environment:
      - PUID=${DOCKER_PUID}
      - PGID=${DOCKER_PGID}
      - TZ=Asia/Jerusalem
      - JELLYSEER_HOSTNAME=http://localhost:5055
    volumes:
      - /volume1/Media/SmartHome/Config/jellyseer:/app/config
    ports:
      - 5055:5055
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 4.4.4.4
      - 1.1.1.1
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  minecraft:
    image: itzg/minecraft-bedrock-server
    container_name: media-minecraft-server
    network_mode: bridge
    environment:
      - PUID=${DOCKER_PUID}
      - PGID=${DOCKER_PGID}
      - TZ=Asia/Jerusalem
      - EULA=TRUE
      - MOTD="Benita's Awesome Minecraft server"
      - DIFFICULTY=hard
    ports:
      - "19132:19132/udp"
    volumes:
      - /volume1/Media/SmartHome/Config/minecraft:/data
    restart: unless-stopped
