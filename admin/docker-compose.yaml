version: '3'
networks:
  default:
    external:
      name: bridge

services:
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    environment:
      - PUID=${DOCKER_PUID}
      - PGID=${DOCKER_PGID}
      - TZ=Asia/Jerusalem
      - PASSWORD=${CODE_SERVER_PASS}
      - SUDO_PASSWORD=${CODE_SERVER_SUDO_PASS}
      - DOCKER_MODS=linuxserver/mods:code-server-docker
    volumes:
      - /volume1/Media/SmartHome/Config/code-server:/config
      - /volume1/Media/SmartHome/Config/HomeAssistant:/config/workspace/OLD-hass-config
      - /volume1/Media/SmartHome/Config/HASS:/config/workspace/hass-config
      - /volume1/Media/SmartHome/Backup/docker-compose:/config/workspace/docker-compose
      - /volume1/Media/SmartHome/Config/zigbee2mqtt:/config/workspace/zigbee2mqtt-config
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 8443:8443
    restart: unless-stopped
    network_mode: bridge
    dns:
      - 8.8.8.8
      - 4.4.4.4
      - 1.1.1.1
    labels:

  prune:
    container_name: admin-prune-cleanup
    image: "liske/docker-prune"
    command: ["image"]
    network_mode: bridge
    environment:
      - SLEEP=10800
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:

