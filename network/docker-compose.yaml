version: '3'

services:
  cloudflare-tunnel:
    container_name: network-cloudflare-tunnel-hass
    hostname: hass-cloudflare-tunnel
    image: cloudflare/cloudflared:latest
    restart: always
    volumes:
      - /volume1/Media/SmartHome/Config/cloudflared/hass:/config
      - /etc/localtime:/etc/localtime
    environment:
      - PUID=${DOCKER_PUID}
      - PGID=${DOCKER_PGID}
      - TZ="Asia/Jerusalem"
    network_mode: host
    command: tunnel --no-autoupdate run --token ${HASS_CF_TUNNEL_TOKEN}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  cloudflare-tunnel-replica:
    container_name: network-cloudflare-tunnel-hass-replica
    hostname: hass-cloudflare-tunnel-replica
    image: cloudflare/cloudflared:latest
    restart: always
    volumes:
      - /volume1/Media/SmartHome/Config/cloudflared/hass:/config
      - /etc/localtime:/etc/localtime
    environment:
      - PUID=${DOCKER_PUID}
      - PGID=${DOCKER_PGID}
      - TZ=Asia/Jerusalem
    network_mode: host
    command: tunnel --no-autoupdate run --token ${HASS_CF_TUNNEL_TOKEN}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
